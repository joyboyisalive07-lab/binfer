name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        run: python -m pytest

      - name: Self test
        run: python -m binfer --self-test --no-color

      - name: Coverage
        run: python tools/coverage.py

      - name: Images are up to date
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          python tools/make_images.py
          git diff --exit-code docs/img
