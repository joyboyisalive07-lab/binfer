name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-executable:
    name: Build and publish binfer.exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      # build.ps1 refuses to finish unless the executable it just produced runs
      # --self-test and recovers the ground truth of every synthetic format.
      - name: Build and verify
        run: pwsh tools/build.ps1

      # gh ships on the runner and authenticates with the default token, so the
      # release needs no third-party action and no secret.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/binfer.exe --generate-notes
